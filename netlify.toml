[build]
  base = "frontend"
  command = "npm run build"
  publish = "dist"

# VITE_API_URL é URL pública do front (não segredo). Sem omit, o Secrets Scanner
# falha o build porque Vite embute a variável no bundle do browser.
[build.environment]
  VITE_API_URL = "/api"
  # Chaves publishable (vão no bundle do browser). Sem isso o login só usa senha local → 401 com senha do Supabase Auth.
  VITE_SUPABASE_URL = "https://jbwevorqvologcdhnspe.supabase.co"
  VITE_SUPABASE_ANON_KEY = "sb_publishable_xSgO54jaYOjf8jxXJnXsug_Pk1NhAja"
  SECRETS_SCAN_OMIT_KEYS = "VITE_API_URL,VITE_SUPABASE_URL,VITE_SUPABASE_ANON_KEY"

[[headers]]
  for = "/admin/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/admin/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"
    Cache-Control = "no-cache"

# Proxy da API para o Render (obrigatório: sem isso /api vira o HTML do SPA e o login falha no PWA)
[[redirects]]
  from = "/api/*"
  to = "https://cinegeracao.onrender.com/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/uploads/*"
  to = "https://cinegeracao.onrender.com/uploads/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/admin/sw.js"
  to = "/admin/sw.js"
  status = 200
  force = true

[[redirects]]
  from = "/admin/manifest.webmanifest"
  to = "/admin/manifest.webmanifest"
  status = 200
  force = true

# HTML do painel com Open Graph próprio (WhatsApp diferencia do site público)
[[redirects]]
  from = "/admin"
  to = "/admin.html"
  status = 200
  force = true

[[redirects]]
  from = "/admin/"
  to = "/admin.html"
  status = 200
  force = true

[[redirects]]
  from = "/admin/*"
  to = "/admin.html"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
